name: ⛩️ Kamiya Juku Instagram Automation

on:
  schedule:
    # 前日 12:00 CEST (UTC 10:00): 日・火・木 にプレビュー配信
    - cron: '0 10 * * 0,2,4'
    # 当日 18:00 CEST (UTC 16:00): 月・水・金 に本番自動投稿
    - cron: '0 16 * * 1,3,5'
  workflow_dispatch:
    inputs:
      action:
        description: '実行するアクションを選択してください'
        required: true
        default: 'eve_preview'
        type: choice
        options:
          - 'eve_preview'
          - 'publish_today'
          - 'preview_lunes'
          - 'preview_miercoles'
          - 'preview_viernes'
          - 'publish_lunes'
          - 'publish_miercoles'
          - 'publish_viernes'

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 依存パッケージのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🚀 投稿自動化スクリプトの実行
        env:
          TZ: 'Europe/Madrid'
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
            if [ "$ACTION" = "eve_preview" ]; then
              python autonomous_scheduler.py eve_preview
            elif [ "$ACTION" = "publish_today" ]; then
              python autonomous_scheduler.py publish_today
            elif [ "$ACTION" = "preview_lunes" ]; then
              python autonomous_scheduler.py preview LUNES
            elif [ "$ACTION" = "preview_miercoles" ]; then
              python autonomous_scheduler.py preview MIERCOLES
            elif [ "$ACTION" = "preview_viernes" ]; then
              python autonomous_scheduler.py preview VIERNES
            elif [ "$ACTION" = "publish_lunes" ]; then
              python autonomous_scheduler.py publish LUNES
            elif [ "$ACTION" = "publish_miercoles" ]; then
              python autonomous_scheduler.py publish MIERCOLES
            elif [ "$ACTION" = "publish_viernes" ]; then
              python autonomous_scheduler.py publish VIERNES
            fi
          else
            # 定期Cron実行時（UTC 10:00 = スペイン12:00前日プレビュー, UTC 16:00 = スペイン18:00当日投稿）
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -lt 14 ]; then
              echo "☀️ 前日12:00 プレビュー配信を実行します..."
              python autonomous_scheduler.py eve_preview
            else
              echo "🚀 当日18:00 Instagram本番投稿を実行します..."
              python autonomous_scheduler.py publish_today
            fi
          fi

      - name: 🔄 ステータス更新（CSV/XLSX）のコミット＆プッシュ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 02_planning/content_ideas_sheet.xlsx 02_planning/content_ideas_sheet.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No changes in content_ideas_sheet to commit."
          else
            git commit -m "chore: auto-update content queue status (published)"
            git push origin main || true
          fi
